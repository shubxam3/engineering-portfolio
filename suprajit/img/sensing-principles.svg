<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="780" height="300" fill="#ffffff"/>
  <text x="16" y="26" font-size="15" font-weight="600" fill="#1f2a37">Throttle position sensing: principles compared in the survey</text>

  <g stroke="#1f2a37" stroke-width="1.4" fill="none">
    <path d="M390 92 V112 H170 V132"/>
    <path d="M390 112 H560 V132"/>
    <path d="M560 180 V200 H360 V216"/>
    <path d="M560 200 V216"/>
    <path d="M560 200 H700 V216"/>
  </g>

  <g stroke="#1f2a37" stroke-width="1.4">
    <rect x="290" y="46" width="200" height="46" rx="6" fill="#eef3fa"/>
    <rect x="80" y="132" width="180" height="48" rx="6" fill="#f3f3f3"/>
    <rect x="470" y="132" width="180" height="48" rx="6" fill="#eef3fa"/>
    <rect x="300" y="216" width="120" height="46" rx="6" fill="#f3f3f3"/>
    <rect x="500" y="216" width="120" height="46" rx="6" fill="#f3f3f3"/>
    <rect x="640" y="216" width="120" height="46" rx="6" fill="#fdf3e1"/>
  </g>

  <g fill="#1f2a37" text-anchor="middle">
    <text x="390" y="74">Twist angle of the grip</text>
    <text x="170" y="153">Contact</text>
    <text x="170" y="170" font-size="11.5" fill="#4a5a6a">resistive track and wiper</text>
    <text x="560" y="153">Non-contact</text>
    <text x="560" y="170" font-size="11.5" fill="#4a5a6a">no wearing parts</text>
    <text x="360" y="236">Magnetic</text>
    <text x="360" y="252" font-size="11.5" fill="#4a5a6a">Hall effect</text>
    <text x="560" y="244">Inductive</text>
    <text x="700" y="236">Optical</text>
    <text x="700" y="252" font-size="11.5" fill="#4a5a6a">chosen route</text>
  </g>

  <text x="16" y="288" fill="#4a5a6a" font-size="11.5">Compared on wear, sensitivity to dirt and stray magnetic fields, resolution, redundancy, cost and packaging.</text>
</svg>
