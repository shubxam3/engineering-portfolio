<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a37"/>
    </marker>
  </defs>
  <rect width="820" height="290" fill="#ffffff"/>
  <text x="16" y="26" font-size="15" font-weight="600" fill="#1f2a37">Steering-lock actuator: function chain and what is sized at each step</text>

  <g fill="#eef3fa" stroke="#1f2a37" stroke-width="1.4">
    <rect x="16" y="70" width="118" height="64" rx="6"/>
    <rect x="150" y="70" width="118" height="64" rx="6"/>
    <rect x="284" y="70" width="118" height="64" rx="6"/>
    <rect x="418" y="70" width="118" height="64" rx="6"/>
    <rect x="552" y="70" width="118" height="64" rx="6"/>
    <rect x="686" y="70" width="118" height="64" rx="6" fill="#f3f3f3"/>
    <rect x="500" y="196" width="222" height="52" rx="6" fill="#fdf3e1"/>
  </g>

  <g fill="#1f2a37" text-anchor="middle">
    <text x="75" y="98">Vehicle</text><text x="75" y="116">controller</text>
    <text x="209" y="98">DC motor</text><text x="209" y="116">(brushed)</text>
    <text x="343" y="98">Two-stage</text><text x="343" y="116">planetary gear</text>
    <text x="477" y="98">Cam and</text><text x="477" y="116">rocker arm</text>
    <text x="611" y="98">Locking</text><text x="611" y="116">plunger</text>
    <text x="745" y="98">Steering</text><text x="745" y="116">column</text>
    <text x="611" y="218">Optical switches</text><text x="611" y="236">plunger end positions</text>
  </g>

  <g fill="#4a5a6a" text-anchor="middle" font-size="11.5" font-style="italic">
    <text x="75" y="60">lock / unlock</text>
    <text x="209" y="60">torque, speed, current</text>
    <text x="343" y="60">ratio, tooth stress</text>
    <text x="477" y="60">lever arm, angle</text>
    <text x="611" y="60">force, travel, time</text>
    <text x="745" y="60">abuse torque</text>
  </g>

  <g stroke="#1f2a37" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M134 102 H149"/>
    <path d="M268 102 H283"/>
    <path d="M402 102 H417"/>
    <path d="M536 102 H551"/>
    <path d="M670 102 H685"/>
    <path d="M611 134 V195"/>
    <path d="M500 222 H75 V135"/>
  </g>
  <text x="288" y="214" fill="#4a5a6a" font-size="11.5" font-style="italic" text-anchor="middle">position feedback</text>
  <text x="16" y="276" fill="#4a5a6a" font-size="11.5">Sizing runs right to left: the plunger requirement sets the lever, the lever sets output torque and speed, and these set gear ratio and motor.</text>
</svg>
